# Standalone driver build: contains the checked patch; publishes an artifact only.
name: Build POCO F7 Adreno 825 ZIP
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/poco-f7-a825-build
    paths:
    - .github/workflows/poco-f7-a825-build.yml
permissions:
  contents: read
concurrency:
  group: poco-f7-a825-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_COMMIT: d8f6496ae30b0be18d36f3943c6f16e5c08b7f6c
  MESA_COMMIT: 9ce7a2ef35ae1ab06e024860a0f247962ab11b95
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Install build tools
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y git curl unzip zip patch ninja-build patchelf flex bison   glslang-tools ccache pkg-config clang lld llvm python3-pip binutils cmake
        python3 -m pip install --break-system-packages 'meson>=1.5' mako pyyaml packaging
        # Support both glslang executable names used by different Ubuntu package versions.
        mkdir -p "$RUNNER_TEMP/turnip-bin"
        if ! command -v glslang >/dev/null 2>&1; then
          ln -s "$(command -v glslangValidator)" "$RUNNER_TEMP/turnip-bin/glslang"
        fi
        echo "$RUNNER_TEMP/turnip-bin" >> "$GITHUB_PATH"
    - name: Fetch the tested repository base
      run: |
        set -euo pipefail
        git init source
        git -C source remote add origin https://github.com/TuTiTaM-dot/Banners-Turnip.git
        git -C source fetch --depth=1 origin "$SOURCE_COMMIT"
        git -C source checkout --detach FETCH_HEAD
        test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
