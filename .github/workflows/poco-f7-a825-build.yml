    - name: Download Android NDK and pinned Mesa source
      run: |
        set -euo pipefail
        mkdir -p source/turnip_workdir
        curl --fail --location --retry 4 --connect-timeout 30   https://dl.google.com/android/repository/android-ndk-r29-linux.zip   --output "$RUNNER_TEMP/android-ndk-r29-linux.zip"
        unzip -q "$RUNNER_TEMP/android-ndk-r29-linux.zip" -d source/turnip_workdir
        rm "$RUNNER_TEMP/android-ndk-r29-linux.zip"
        git init source/turnip_workdir/mesa
        git -C source/turnip_workdir/mesa remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
        ok=0
        for attempt in 1 2 3 4; do
          if git -C source/turnip_workdir/mesa fetch --depth=1 origin "$MESA_COMMIT"; then ok=1; break; fi
          sleep 10
        done
        test "$ok" = 1
        git -C source/turnip_workdir/mesa checkout --detach FETCH_HEAD
        test "$(git -C source/turnip_workdir/mesa rev-parse HEAD)" = "$MESA_COMMIT"
    - name: Compile the A825 Android driver
      working-directory: source
      run: |
        set -euo pipefail
        export BUILD_VERSION="$GITHUB_RUN_NUMBER"
        export BUILD_SUFFIX=A825
        export SKIP_SOURCE_DOWNLOAD=1
        export EXTRA_PATCH=patches/a8xx_gen8.patch
        export EXTRA_SCRIPT=patches/a8xx_shared_mem.py:patches/a840v2.py:patches/a825.py
        export META_NAME="Mesa Turnip POCO F7 Adreno 825 ($MESA_COMMIT)"
        export META_DESC="Experimental POCO F7 / Snapdragon 8s Gen 4 / Adreno 825 driver. KGSL chip 0x44030000. Mesa Gen8 patches and verified A825 device configuration."
        bash build_turnip.sh
    - name: Verify and package the driver ZIP
      working-directory: source
      run: |
        set -euo pipefail
        python3 .github/scripts/verify_a825.py   --header turnip_workdir/mesa/build-android-aarch64/src/freedreno/common/freedreno_devices.h
        mkdir -p dist
        export INPUT_ZIP="turnip_workdir/mesa-turnip-main-A825-V${GITHUB_RUN_NUMBER}.zip"
        export DRIVER_ZIP="dist/Turnip-POCO-F7-Adreno825-${MESA_COMMIT:0:10}.zip"
        export META_NAME="Mesa Turnip POCO F7 Adreno 825 ($MESA_COMMIT)"
        python3 - <<'PY_ZIP'
        import json, os, zipfile
        with zipfile.ZipFile(os.environ['INPUT_ZIP']) as source:
            driver = source.read('libvulkan_freedreno.so')
            meta = json.loads(source.read('meta.json'))
        meta['packageVersion'] = os.environ['GITHUB_RUN_NUMBER']
        meta['minApi'] = 34
        with zipfile.ZipFile(os.environ['DRIVER_ZIP'], 'w', zipfile.ZIP_DEFLATED) as target:
            target.writestr('libvulkan_freedreno.so', driver)
            target.writestr('meta.json', json.dumps(meta, indent=2) + '\n')
        PY_ZIP
        python3 .github/scripts/verify_driver_zip.py --kind android   --zip "$DRIVER_ZIP" --variant a8xx --expect-name "$META_NAME"   --expect-package-version "$GITHUB_RUN_NUMBER" --report dist/verification.json
        sha256sum "$DRIVER_ZIP" > "$DRIVER_ZIP.sha256"
    - name: Upload the verified driver
      uses: actions/upload-artifact@v4
      with:
        name: Turnip-POCO-F7-Adreno825
        path: source/dist/
        if-no-files-found: error
        retention-days: 14
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: POCO-F7-build-logs
        path: source/turnip_workdir/mesa/build-android-aarch64/meson-logs/
        if-no-files-found: ignore
        retention-days: 7
